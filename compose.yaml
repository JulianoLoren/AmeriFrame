name: mosaic

services:
  web:
    image: ${MOSAIC_IMAGE:-mosaic-web:local}
    build:
      context: .
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:stable-alpine@sha256:4714e0b1b2577eaa1a6131d07c958b67f0eb68e6d0521e90c6e5287db8cf0bc5}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    networks: [origin]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4}
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets: [cloudflare_tunnel_token]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, "127.0.0.1:2000", ready]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [origin, edge]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# No ports: mappings and no host networking. Only cloudflared has egress.
networks:
  origin:
    internal: true
  edge:

secrets:
  cloudflare_tunnel_token:
    file: ${TUNNEL_TOKEN_FILE:-./secrets/cloudflare-tunnel-token.txt}
